name: Compilar exe y apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: neon-survival-pc
        run: npm install
      - name: Compilar el exe
        working-directory: neon-survival-pc
        run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NeonSurvival-Windows
          path: neon-survival-pc/dist/*.exe

  android-apk:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crear proyecto Android con Capacitor
        run: |
          mkdir android-app
          cd android-app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../neon-survival-pc/index.html ../neon-survival-pc/manifest.json ../neon-survival-pc/sw.js ../neon-survival-pc/icon-*.png www/
          npx cap init "Neon Survival" com.neonsurvival.game --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Compilar el apk
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NeonSurvival-Android
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
